<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <span class="brand-icon">✦</span>
      <div class="brand-text">
        <span class="brand-name">KAISTU</span>
        <span class="brand-sub">Studio</span>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a
        class="nav-link"
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        <span class="nav-icon">📊</span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a
        class="nav-link"
        routerLink="/universes"
        routerLinkActive="active"
      >
        <span class="nav-icon">🌌</span>
        <span class="nav-label">Universos</span>
      </a>
      <a
        class="nav-link"
        routerLink="/characters"
        routerLinkActive="active"
      >
        <span class="nav-icon">👤</span>
        <span class="nav-label">Personajes</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <span class="version">v0.0.1</span>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div class="topbar-left">
        <h2 class="topbar-title">
          @if (universeService.activeUniverse(); as universe) {
            {{ universe.name }}
          } @else {
            Panel de Administración
          }
        </h2>
      </div>
      <div class="topbar-right">
        <label class="universe-selector">
          <span class="selector-label">Universo activo</span>
          <select
            class="selector-input"
            [value]="universeService.activeUniverse()?.id ?? ''"
            (change)="onUniverseChange($event)"
          >
            <option value="" disabled>Seleccionar universo...</option>
            @for (u of universeService.universes(); track u.id) {
              <option [value]="u.id">{{ u.name }}</option>
            }
          </select>
        </label>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
